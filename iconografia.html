<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPQ — Iconografia</title>
<style>
  :root {
    --bg: #020b16;
    --surface: #0a1628;
    --surface-2: #0f2140;
    --border: #1a3a5c;
    --text: #e6f3ff;
    --text-muted: #7d9cbd;
    --cyan: #22d3ee;
    --cyan-dim: rgba(34,211,238,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(34,211,238,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .icon-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .icon-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    width: 100px;
    text-align: center;
    color: var(--cyan);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .icon-item svg {
    width: 32px;
    height: 32px;
  }
  .icon-label {
    font-size: 10px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <h1>Sistema de Iconografia EPQ</h1>
  <div class="card">
    <div class="section-title">Aplicação em interface</div>
    <div class="icon-row">
      <div class="icon-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <div class="icon-label">Estudo</div>
      </div>
      <div class="icon-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <div class="icon-label">Questão</div>
      </div>
      <div class="icon-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <div class="icon-label">Cronograma</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

services:
  - type: web
    name: epq-crm
    env: python
    plan: free
    runtime: python-3.11
    buildCommand: pip install -r crm-backend/requirements.txt
    startCommand: cd crm-backend && python3 flask_app.py
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./crm.db
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
    # Usuários iniciais serão criados via render_init.py após deploy.
    # Senhas temporárias devem ser alteradas no primeiro login.
    # Aviso: Render Free não garante persistência do SQLite entre deploys/desligamentos.

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EPQ · Acesso Restrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-deep:#04070f;
    --blue:#2f7fff;
    --cyan:#5fe8f7;
    --white:#f3f6fb;
    --mute:#8a9bb8;
    --mute-dim:#5c6a82;
    --radius:18px;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-sans);
    color:var(--white);
    background:radial-gradient(1200px 700px at 10% -10%, rgba(56,189,248,0.10), transparent 60%),
      radial-gradient(1000px 600px at 110% 10%, rgba(99,102,241,0.10), transparent 55%),
      linear-gradient(180deg,#05080f,#0b1428);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    overflow:hidden;
  }
  .noise{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.08;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:220px 220px;
  }
  .grid-bg{
    position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.12;mask-image:radial-gradient(ellipse 70% 55% at 50% 0%,#000 0%,transparent 72%);
    background-image:linear-gradient(rgba(80,160,255,0.08) 1px,transparent 1px),linear-gradient(90deg,rgba(80,160,255,0.08) 1px,transparent 1px);
    background-size:48px 48px;
  }
  .card{
    position:relative;z-index:1;width:100%;max-width:420px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:22px;
    padding:26px;
    box-shadow:0 0 0 1px rgba(80,180,255,0.08),0 24px 60px -20px rgba(80,160,255,0.35);
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(80,180,255,0.35) 40%,transparent 80%);opacity:.9;
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .brand img{height:36px;width:36px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,0.08);padding:4px}
  .brand-text .title{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
  .brand-text .title strong{display:block;color:var(--white);font-size:13px;letter-spacing:.12em;margin-top:2px}
  .status{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:#34d399;border:1px solid rgba(52,211,153,0.35);padding:5px 10px;border-radius:20px;background:rgba(52,211,153,0.08);display:inline-flex;align-items:center;gap:7px;text-transform:uppercase;margin-bottom:16px}
  .pulse{width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,0.55)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  .form{display:grid;gap:12px}
  label{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em}
  input{
    width:100%;padding:12px 12px;border-radius:14px;border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.06);color:var(--white);font-size:13px;outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{border-color:rgba(34,211,238,0.45);box-shadow:0 0 0 3px rgba(34,211,238,0.08)}
  .btn{
    border:1px solid rgba(255,255,255,0.18);color:#e6f3ff;background:rgba(255,255,255,0.08);padding:12px 12px;border-radius:14px;font-size:13px;cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:background .15s ease,border-color .15s ease;
  }
  .btn:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.32)}
  .btn.primary{background:rgba(34,211,238,0.18);border-color:rgba(34,211,238,0.45);color:#cffafe;font-weight:700}
  .btn.primary:hover{background:rgba(34,211,238,0.28);border-color:rgba(34,211,238,0.65)}
  .hint{font-size:12px;color:#f87171;min-height:16px;margin-top:4px}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--mute-dim);margin-top:14px;text-align:center;letter-spacing:.08em}
  @media (max-width:520px){.card{padding:18px}}
</style>
</head>
<body>
<div class="noise"></div>
<div class="grid-bg"></div>
<div class="card">
  <div class="brand">
    <img src="https://flavio-guedes.github.io/epq-central/logo.jpg" alt="EPQ" />
    <div class="brand-text">
      <div class="title">Central <strong>EPQ</strong></div>
    </div>
  </div>
  <div class="status"><span class="pulse"></span>Sistema operacional</div>
  <form id="loginForm" class="form" autocomplete="off">
    <div>
      <label>Login</label>
      <input id="username" type="text" placeholder="seu.login" required />
    </div>
    <div>
      <label>Senha</label>
      <input id="password" type="password" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn primary">Entrar no sistema</button>
    <div id="hint" class="hint"></div>
  </form>
  <div class="meta">Acesso restrito · ADMIN MASTER · GESTOR · OPERACIONAL</div>
</div>
<script>
  const API = 'http://127.0.0.1:5000';
  const form = document.getElementById('loginForm');
  const hint = document.getElementById('hint');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hint.textContent = 'Autenticando...';
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    try {
      const res = await fetch(`${API}/auth/login`, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ username, password }) });
      const data = await res.json();
      if (!res.ok) { hint.textContent = data.detail || 'Credenciais inválidas'; return; }
      localStorage.setItem('epq_crm_token', data.access_token);
      localStorage.setItem('epq_crm_user', JSON.stringify({ id: data.user_id, nome: data.nome, perfil: data.perfil, must_change_password: data.must_change_password }));
      if (data.must_change_password) { window.location.href = 'change-password.html'; return; }
      window.location.href = 'index.html';
    } catch (err) { hint.textContent = 'Erro de conexão com o servidor'; }
  });
</script>
</body>
</html>
